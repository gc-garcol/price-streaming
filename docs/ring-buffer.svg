<text x="491.4" y="247.6" fill="#0b0e11" font-size="15" font-weight="700" text-anchor="middle">31</text>
<text x="687.4" y="443.6" fill="#0b0e11" font-size="15" font-weight="700" text-anchor="middle">24</text>
<text x="638.9" y="603.6" fill="#0b0e11" font-size="15" font-weight="700" text-anchor="middle">20</text>
<text x="533.4" y="674.1" fill="#0b0e11" font-size="15" font-weight="700" text-anchor="middle">17</text>
<text x="448.6" y="682.4" fill="#0b0e11" font-size="15" font-weight="700" text-anchor="middle">15</text>
<text x="470" y="452" fill="#eaecef" font-size="17" font-weight="700" text-anchor="middle">ring buffer</text>
<text x="470" y="476" fill="#9aa4b2" font-size="13" text-anchor="middle">pre-allocated DisruptorEvent</text>
<text x="470" y="496" fill="#9aa4b2" font-size="13" text-anchor="middle">per slot &#183; mutated in place</text>
<rect x="345" y="78" width="270" height="74" rx="11" fill="#1e2329" stroke="#0ecb81" stroke-width="1.6"/>
<text x="480" y="102" fill="#eaecef" font-size="14" font-weight="700" text-anchor="middle">producers (MULTI)</text>
<text x="480" y="122" fill="#9aa4b2" font-size="12" text-anchor="middle">kafka consumer · feed scheduler</text>
<text x="480" y="139" fill="#9aa4b2" font-size="12" text-anchor="middle">websocket stream · config refresh</text>
<path d="M 500.0 152.0 Q 484.4 168.9 496.8 188.3" fill="none" stroke="#9aa4b2" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="40" y="92" fill="#0ecb81" font-size="12.5">producers are claiming slot 31.</text>
<text x="40" y="110" fill="#0ecb81" font-size="12.5">They keep advancing, only checking</text>
<text x="40" y="128" fill="#0ecb81" font-size="12.5">they never wrap past H4 cleanup.</text>
<rect x="830" y="300" width="250" height="74" rx="11" fill="#1e2329" stroke="#f0b90b" stroke-width="1.6"/>
<text x="955" y="324" fill="#eaecef" font-size="14" font-weight="700" text-anchor="middle">H1 domain</text>
<text x="955" y="344" fill="#9aa4b2" font-size="12" text-anchor="middle">applies to PriceState,</text>
<text x="955" y="361" fill="#9aa4b2" font-size="12" text-anchor="middle">recomputes the band</text>
<path d="M 830.0 337.0 Q 778.5 378.4 741.7 433.2" fill="none" stroke="#9aa4b2" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1100" y="330" fill="#9aa4b2" font-size="12.5">reads slot 24. May run</text>
<text x="1100" y="348" fill="#9aa4b2" font-size="12.5">forward as far as slot 30.</text>
<rect x="830" y="430" width="250" height="64" rx="11" fill="#1e2329" stroke="#f0b90b" stroke-width="1.6"/>
<text x="955" y="454" fill="#eaecef" font-size="14" font-weight="700" text-anchor="middle">H2 caching</text>
<text x="955" y="474" fill="#9aa4b2" font-size="12" text-anchor="middle">batches → Redis hashes</text>
<path d="M 830.0 462.0 Q 746.5 539.7 681.0 633.2" fill="none" stroke="#9aa4b2" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1100" y="455" fill="#9aa4b2" font-size="12.5">trails H1, never</text>
<text x="1100" y="473" fill="#9aa4b2" font-size="12.5">overtakes it.</text>
<rect x="760" y="570" width="250" height="64" rx="11" fill="#1e2329" stroke="#f0b90b" stroke-width="1.6"/>
<text x="885" y="594" fill="#eaecef" font-size="14" font-weight="700" text-anchor="middle">H3 publishing</text>
<text x="885" y="614" fill="#9aa4b2" font-size="12" text-anchor="middle">batches → Centrifugo</text>
<path d="M 760.0 602.0 Q 647.7 649.4 549.2 721.2" fill="none" stroke="#9aa4b2" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1030" y="595" fill="#9aa4b2" font-size="12.5">flushes on endOfBatch</text>
<text x="1030" y="613" fill="#9aa4b2" font-size="12.5">or max batch size.</text>
<rect x="560" y="720" width="250" height="64" rx="11" fill="#1e2329" stroke="#f6465d" stroke-width="1.6"/>
<text x="685" y="744" fill="#eaecef" font-size="14" font-weight="700" text-anchor="middle">H4 cleanup</text>
<text x="685" y="764" fill="#9aa4b2" font-size="12" text-anchor="middle">event.reset() — gating</text>
<path d="M 600.0 720.0 Q 520.9 715.9 443.2 731.7" fill="none" stroke="#9aa4b2" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="840" y="740" fill="#f6465d" font-size="12.5">H4 is the slowest consumer, so it gates the ring:</text>
<text x="840" y="758" fill="#f6465d" font-size="12.5">producers block rather than wrap past slot 15.</text>
<text x="840" y="776" fill="#f6465d" font-size="12.5">Only H4 may clear a slot for reuse.</text>
